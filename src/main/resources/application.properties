spring.data.mongodb.uri=${MONGODB_URL}

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE}

######### Health check #########
management.endpoints.enabled-by-default=false
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=/strike-off-objections-api/healthcheck
management.endpoint.health.show-details=never
management.endpoint.health.enabled=true

server.port=${PORT:5009}
chs.api.key=${CHS_API_KEY}
chs.kafka.api.url=${CHS_KAFKA_API_URL}